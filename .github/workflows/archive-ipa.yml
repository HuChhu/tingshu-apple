name: archive-ipa
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  archive:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: runner selfcheck
        run: |
          sw_vers || true
          xcodebuild -version
          xcodebuild -showsdks | grep -i iphoneos || true
          uname -m

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-macos-arm64-kotlin-2.0.21-v3

      - name: link framework (task-level assertion, no SKIPPED fake-green)
        run: |
          cd shared
          printf "kotlin.native.ignoreDisabledTargets=true\\n" >> gradle.properties
          set -o pipefail
          chmod +x gradlew
          ./gradlew linkReleaseFrameworkIosArm64 --no-daemon --stacktrace --console=plain 2>&1 | tee /tmp/link.log
          if grep -qE "linkReleaseFrameworkIosArm64 SKIPPED" /tmp/link.log; then
            echo "::error::linkReleaseFrameworkIosArm64 SKIPPED - zero artifact"
            exit 1
          fi
          grep -qE "BUILD SUCCESSFUL" /tmp/link.log || { echo "::error::build not successful"; exit 1; }

      - name: verify framework artifact
        run: |
          set -e
          FW=$(find shared/build/bin -type d -name "shared.framework" | head -1)
          [ -n "$FW" ] || { echo "::error::shared.framework not produced"; exit 1; }
          echo "framework: $FW"
          ls -la "$FW"
          file "$FW/shared"
          file "$FW/shared" | grep -q "Mach-O" || { echo "::error::not Mach-O"; exit 1; }
          file "$FW/shared" | grep -q "arm64" || { echo "::error::not arm64"; exit 1; }
          # K/N 实际输出目录为小写 releaseFramework；pbxproj 指向 ReleaseFramework。
          # 直接创建大写目录并整目录复制（含 Headers/Modules/Info.plist/二进制）。
          # macOS 默认大小写不敏感：ReleaseFramework 与 releaseFramework 是同一目录，
          # rm -rf 会连同源目录一起删掉。改为整目录 cp 到临时名再改回大写目录名。
          cd shared/build/bin/iosArm64
          ls -la
          rm -rf _fwtmp
          cp -R releaseFramework/shared.framework _fwtmp
          rm -rf releaseFramework
          mkdir -p ReleaseFramework
          mv _fwtmp ReleaseFramework/shared.framework
          cd - >/dev/null
          ls -la shared/build/bin/iosArm64/ReleaseFramework/shared.framework
          file shared/build/bin/iosArm64/ReleaseFramework/shared.framework/shared | grep -q "arm64" || { echo "::error::copied framework not arm64"; exit 1; }

      - name: verify AppIcon present
        run: |
          set -e
          ICON=ios/ios-shell/Assets.xcassets/AppIcon.appiconset
          ls -la "$ICON"
          [ -f "$ICON/AppIcon-1024.png" ] || { echo "::error::AppIcon-1024.png missing"; exit 1; }
          python3 -c "import struct;d=open('$ICON/AppIcon-1024.png','rb').read();w,h=struct.unpack('>II',d[16:24]);print('icon',w,'x',h);assert w==1024 and h==1024"
          python3 -c "import json;c=json.load(open('$ICON/Contents.json'));img=c['images'][0];assert img.get('filename'),'filename missing';print('contents ok',img)"

      - name: xcodebuild archive (unsigned)
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild -project ios/Tingshu.xcodeproj -scheme Tingshu -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -archivePath build/Tingshu.xcarchive archive CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" CODE_SIGN_STYLE=Manual 2>&1 | tee /tmp/archive.log
          grep -q "ARCHIVE SUCCEEDED" /tmp/archive.log || { echo "::error::archive failed"; exit 1; }

      - name: package unsigned IPA
        run: |
          set -e
          APP=$(find build/Tingshu.xcarchive/Products/Applications -maxdepth 1 -name "*.app" | head -1)
          [ -n "$APP" ] || { echo "::error::.app not produced"; exit 1; }
          echo "APP: $APP"
          rm -rf build/Payload build/Tingshu-unsigned.ipa
          mkdir -p build/Payload
          cp -R "$APP" build/Payload/
          cd build && zip -qry Tingshu-unsigned.ipa Payload
          ls -la Tingshu-unsigned.ipa
          unzip -l Tingshu-unsigned.ipa | head -20

      - name: IPA structure verify
        run: |
          set -e
          cd build
          rm -rf /tmp/ipa-check && mkdir -p /tmp/ipa-check
          unzip -q Tingshu-unsigned.ipa -d /tmp/ipa-check
          APP=/tmp/ipa-check/Payload/Tingshu.app
          [ -d "$APP" ] || { echo "::error::bad Payload"; exit 1; }
          echo "--- Mach-O ---"
          file "$APP/Tingshu"
          file "$APP/Tingshu" | grep -q "arm64" || { echo "::error::not arm64"; exit 1; }
          echo "--- Info.plist ---"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :UIBackgroundModes" "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :MinimumOSVersion" "$APP/Info.plist" || true
          echo "--- Frameworks ---"
          ls -la "$APP/Frameworks" || echo "no Frameworks dir"
          echo "--- signature state (expect unsigned) ---"
          codesign -dv "$APP" 2>&1 | head -5 || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Tingshu-unsigned-ipa
          path: build/Tingshu-unsigned.ipa
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-logs
          path: |
            /tmp/link.log
            /tmp/archive.log
          if-no-files-found: ignore
