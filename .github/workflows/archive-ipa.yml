name: archive-ipa
on: [workflow_dispatch, push]   # 仓库已转公开 → macOS runner 免费可用
jobs:
  archive:
    runs-on: macos-14   # macOS host：framework link 唯一合法出路（kn-preheat.md 三层对位）
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-macos-aarch64-kotlin-2.0.21
      - name: build shared framework (macOS)
        run: |
          cd shared
          # 双开关：link 任务注册前提（kn-preheat.md 定谳）
          printf "kotlin.native.ignoreDisabledTargets=true\n" >> gradle.properties
          ./gradlew linkReleaseFrameworkIosArm64 --no-daemon
          grep -q "linkReleaseFrameworkIosArm64 SKIPPED" <(./gradlew linkReleaseFrameworkIosArm64 --no-daemon 2>&1) && { echo "::error::link 被跳过"; exit 1; } || true
      - name: place framework (pbxproj 期望的组合目标路径)
        run: |
          SRC=$(find shared/build/bin -name "shared.framework" -type d | head -1)
          [ -n "$SRC" ] || { echo "::error::framework 未产出"; exit 1; }
          mkdir -p shared/build/bin/iosArm64/ReleaseFramework
          cp -R "$SRC" shared/build/bin/iosArm64/ReleaseFramework/
          ls -R shared/build/bin/iosArm64/ReleaseFramework | head -10
      - name: xcodebuild archive (无签名)
        run: |
          xcodebuild -project ios/Tingshu.xcodeproj -scheme Tingshu \
            -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath build/Tingshu.xcarchive archive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
      - name: package unsigned IPA (Payload 打包，ESign 上游标准形态)
        run: |
          mkdir -p build/Payload
          cp -R build/Tingshu.xcarchive/Products/Applications/Tingshu.app build/Payload/
          cd build && zip -qry Tingshu-unsigned.ipa Payload
          ls -la Tingshu-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: Tingshu-unsigned-ipa
          path: build/Tingshu-unsigned.ipa
          if-no-files-found: error
      # 企业证书入 keychain 后的正式导出底稿：ios/ExportOptions-unsigned.plist
      # method=enterprise + xcodebuild -exportArchive（届时替换 Payload 打包步）
